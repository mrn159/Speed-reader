<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speed Reader</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fafaf8;--surface:#fff;--text:#1d1d1b;--muted:#77756f;--border:#dcdad3;--accent:#e5251b;--btn:#1d1d1b;--btn-text:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1e1e1c;--text:#f0eee8;--muted:#9b988f;--border:#36352f;--accent:#ff4a3f;--btn:#f0eee8;--btn-text:#141413}}
:root[data-theme="dark"]{--bg:#141413;--surface:#1e1e1c;--text:#f0eee8;--muted:#9b988f;--border:#36352f;--accent:#ff4a3f;--btn:#f0eee8;--btn-text:#141413}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:20px;font-weight:600;margin:0 0 16px}
textarea{width:100%;height:150px;padding:12px;font:inherit;font-size:15px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;resize:vertical}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
button{font:inherit;font-size:15px;padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
button.primary{background:var(--btn);color:var(--btn-text);border-color:var(--btn);font-weight:600}
label{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:6px}
input[type=number]{width:80px;padding:8px;font:inherit;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:8px}
.stage{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:14px;height:180px;margin-top:8px;overflow:hidden}
.stage::before,.stage::after{content:"";position:absolute;left:50%;width:2px;height:16px;background:var(--border);transform:translateX(-50%)}
.stage::before{top:0}.stage::after{bottom:0}
.word{position:absolute;inset:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;font-family:Georgia,"Times New Roman",serif;font-size:clamp(30px,8vw,56px);white-space:pre}
.word .l{text-align:right}.word .r{text-align:left}
.word .p{color:var(--accent);font-weight:700}
.bar{height:4px;background:var(--border);border-radius:2px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.info{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between}
</style>
</head>
<body>
<main>
<h1>Speed Reader</h1>
<textarea id="text" placeholder="Paste your text here…"></textarea>
<div class="row">
  <button class="primary" id="play">Start</button>
  <button id="restart">Restart</button>
  <label>WPM <input type="number" id="wpm" value="600" min="100" max="1500" step="50"></label>
  <label><input type="checkbox" id="punct"> Pause on punctuation</label>
</div>
<div class="stage"><div class="word" id="word"><span class="l"></span><span class="p">·</span><span class="r"></span></div></div>
<div class="bar"><i id="fill"></i></div>
<div class="info"><span id="count">0 / 0 words</span><span>Space = play/pause</span></div>
</main>
<script>
const $=id=>document.getElementById(id);
const ta=$('text'),wordEl=$('word'),playBtn=$('play'),fill=$('fill'),count=$('count');
let words=[],i=0,timer=null,playing=false,next=0;
function orp(n){return n<=1?0:n<=5?1:n<=9?2:n<=13?3:4}
function show(w){
  const k=orp(w.length);
  wordEl.children[0].textContent=w.slice(0,k);
  wordEl.children[1].textContent=w[k]||'';
  wordEl.children[2].textContent=w.slice(k+1);
}
function progress(){
  fill.style.width=(words.length?i/words.length*100:0)+'%';
  count.textContent=Math.min(i,words.length)+' / '+words.length+' words';
}
function load(){words=ta.value.split(/\s+/).filter(Boolean)}
function delay(w){
  let d=60000/Math.max(100,+$('wpm').value||600);
  if($('punct').checked){if(/[.!?…]$/.test(w))d*=2;else if(/[,;:]$/.test(w))d*=1.5}
  return d;
}
function tick(){
  if(i>=words.length){stop();return}
  const w=words[i++];
  show(w);progress();
  const d=delay(w);
  next+=d;
  timer=setTimeout(tick,Math.max(0,next-performance.now()));
}
function start(){
  if(!words.length||i>=words.length){load();i=0}
  if(!words.length)return;
  playing=true;playBtn.textContent='Pause';
  next=performance.now();tick();
}
function stop(){
  playing=false;clearTimeout(timer);
  playBtn.textContent=i>=words.length?'Replay':'Resume';
  if(i>=words.length)playBtn.textContent='Start';
}
playBtn.onclick=()=>playing?stop():start();
$('restart').onclick=()=>{clearTimeout(timer);playing=false;load();i=0;progress();wordEl.children[0].textContent='';wordEl.children[1].textContent='·';wordEl.children[2].textContent='';playBtn.textContent='Start'};
ta.addEventListener('input',()=>{if(!playing){load();i=0;progress();playBtn.textContent='Start'}});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement!==ta&&document.activeElement.tagName!=='INPUT'){e.preventDefault();playBtn.click()}});
</script>
</body>
</html>
